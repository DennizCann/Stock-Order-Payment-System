spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stock_order_payment}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

logging:
  level:
    com.denizcan.stockorderpayment: INFO
    org.springframework.security: INFO
